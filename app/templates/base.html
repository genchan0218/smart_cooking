<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Pantry{% endblock %}</title><link rel="stylesheet" href="/static/style.css"></head><body>
<nav><b>Pantry</b>
{% set p = request.url.path %}
<a href="/" class="{{ 'on' if p == '/' or p.startswith('/recipe') or p.startswith('/cook') }}">Tonight</a>
<a href="/plan" class="{{ 'on' if p.startswith('/plan') }}">Week</a>
<a href="/inventory" class="{{ 'on' if p.startswith('/inventory') }}">Inventory</a>
<a href="/soon" class="{{ 'on' if p == '/soon' }}">Use soon</a>
<a href="/shopping" class="{{ 'on' if p.startswith('/shopping') }}">Shopping</a>
<a href="/add" class="{{ 'on' if p.startswith('/add') }}">Add</a></nav>
<div class="wrap">{% block body %}{% endblock %}</div></body></html>
